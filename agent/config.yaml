# All models, thresholds, budgets and policy knobs live here -- never in code.
marketplace:
  mode: gigsim            # gigsim | upwork_live  (the ONLY switch between simulator and live; the graphs never know)
  max_requests_per_minute: 20
  live:
    mcp_url: https://mcp.upwork.com/mcp
    min_poll_interval_min: 180        # polite: saved searches never run more often than this in live mode (justified in docs/RUNBOOK.md)
    # port method -> Upwork MCP tool name. Leave null to auto-discover by keywords from list_tools(); set explicitly once seen.
    tool_map: {search_jobs: null, get_job: null, get_client_history: null, get_connects_balance: null, list_messages: null, create_proposal_draft: null, send_message: null}

models:
  profile: open           # open | paid
  # OpenAI-compatible endpoints. Keys come from environment variables only.
  providers:
    groq:
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
  profiles:
    open:
      small:  {provider: groq, model: openai/gpt-oss-20b}
      strong: {provider: groq, model: openai/gpt-oss-120b}
      mid:    {provider: groq, model: qwen/qwen3.8-27b}
      fallback: {provider: groq, model: qwen/qwen3.8-27b}   # switch to openrouter ":free" model if a key is added
    paid:
      mid:    {provider: openrouter, model: anthropic/claude-sonnet-4.5}
      small:  {provider: openrouter, model: anthropic/claude-haiku-4.5}
      strong: {provider: openrouter, model: anthropic/claude-sonnet-4.5}
      fallback: {provider: groq, model: openai/gpt-oss-20b}
  # node -> tier (small|strong). Change here to re-route a node.
  nodes:
    scout: small
    analyst: small
    risk_assessor: small
    fit_matcher: small
    pricing: small
    writer: strong
    critic: mid          # different model family from the writer: no self-review; also spreads free-tier token budgets
    verifier: small
    compliance: small
    client_liaison: mid
  # Provider limits observed on the free tier (Groq): 8000 tokens/min and 1000 requests/day PER MODEL.
  rate_limits: {tokens_per_minute: 7000}     # headroom under the 8000 TPM limit; enforced client-side in agent/llm.py
  reasoning_effort: {small: low, strong: medium}   # gpt-oss only; fewer hidden reasoning tokens = lower latency and TPM use
  # list-price equivalent USD per 1M tokens [input, output]; free tier = $0 actual, we still report list cost
  pricing_usd_per_mtok:
    openai/gpt-oss-20b: [0.075, 0.30]
    openai/gpt-oss-120b: [0.15, 0.75]
    qwen/qwen3.8-27b: [0.30, 0.60]
  embeddings: BAAI/bge-small-en-v1.5
  reranker: BAAI/bge-reranker-base

rag:
  variant: v3_rerank      # chosen by evaluation (see evals/results/rag_eval.json); revisited after the full run
  k: 5
  outcome_boost: 1.0
  v8_threshold: 0.45      # cross-encoder PROBABILITY (CrossEncoder applies a sigmoid). Calibrated on ai_ml only, verified on the other personas: evals/results/v8_threshold.json

budgets:
  max_graph_steps: 30
  max_revisions: 2
  max_tokens_per_job: 30000   # declared budget; measured ~15k for a proposed job (see evals/results)

thresholds:
  minimum_fit_score: 0.60
  maximum_risk_score: 0.70

policy:
  # Platform rules (Connects cost etc.). Policy-change request edits ONLY this block / policy_rules.yaml.
  rules_file: data/policy_pack/policy_rules.yaml

memory:
  style_promote_min_count: 3       # an edit pattern must recur this many times ...
  style_promote_min_jobs: 2        # ... across at least this many distinct jobs
  outcome_promote_min_n: 5         # outcome stats promoted only after this many outcomes per category
autonomy:
  default: manual                  # manual | auto_skip_low_fit  (never auto-send)
