name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid_test}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gigbid:gigbid@localhost:5433/gigbid_test
      RAG_VARIANT: v6_bm25      # CI machines start without the embedding/reranker models; retrieval quality is measured by the eval workflow, not by unit tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install uv && uv pip install --system -e ".[dev]" langchain-openai langgraph-supervisor
      - name: Generate the synthetic data (personas, clients, job pool); not committed
        run: python -m data.build.gen_data
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Repo rules (no inline prompts, gigsim frozen, README numbers trace to evals/results)
        run: make ci-checks PY=python
      - name: Lint
        run: ruff check . --select E9,F63,F7,F82
      - name: Unit, contract (tool-schema snapshots), integration, API tests
        run: |
          python -c "import psycopg; psycopg.connect('postgresql://gigbid:gigbid@localhost:5433/postgres', autocommit=True).execute('CREATE DATABASE gigbid')" || true
          pytest tests mcp_servers -q
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: postgres}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install uv && uv pip install --system -e ".[dev]" && mkdir -p .venv/bin && ln -sf $(which python) .venv/bin/python
      - name: Generate the synthetic data (personas, clients, job pool); not committed
        run: python -m data.build.gen_data
      - run: cd apps/web && npm ci && npx playwright install --with-deps chromium
      - run: cd apps/web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
