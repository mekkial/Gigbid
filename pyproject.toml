[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: multi-agent freelancer copilot (AI-4016 Assignment II)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "pypdf>=4.0",
  "pandas>=2.2",
  "arq>=0.26",
  "cryptography>=43",
  "pyjwt>=2.9",
  "psycopg[binary]>=3.2",
]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["agent", "rag", "evals", "gigsim", "mcp_servers", "apps", "worker"]
